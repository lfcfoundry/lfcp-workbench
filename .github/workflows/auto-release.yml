# Creates a tag and a GitHub Release when main carries a version that has no tag yet.
name: auto-release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag and release when the version is new
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          VERSION=$(grep -ohE '[0-9]{4}[.][0-9]{2}[.][0-9]{2}[.][0-9]{4}' app/index.html | sort -u | tail -1)
          if [ -z "$VERSION" ]; then echo "No version found; nothing to release."; exit 0; fi
          TAG="v$VERSION"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then echo "$TAG already exists."; exit 0; fi
          NOTES=""
          if [ -f "none" ]; then
            NOTES=$(awk '/^## /{ if (seen) exit; if ($0 ~ /@VER@/) next; seen=1; next } seen' "none" | head -40)
          fi
          if [ -z "$NOTES" ]; then NOTES=$(git log -15 --format='- %s'); fi
          printf '%s\n' "$NOTES" > /tmp/notes.md
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$VERSION" --notes-file /tmp/notes.md
